<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI WebStudio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        header { background: #1e293b; padding: 12px 20px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 18px; font-weight: bold; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
        .main-container { display: flex; flex: 1; height: calc(100vh - 57px); }
        .left-panel { width: 45%; border-right: 1px solid #334155; display: flex; flex-direction: column; background: #0f172a; }
        .right-panel { width: 55%; display: flex; flex-direction: column; background: #1e293b; }
        .chat-section { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { padding: 10px 14px; border-radius: 8px; max-width: 85%; font-size: 14px; line-height: 1.4; }
        .message.ai { background: #334155; color: #f8fafc; align-self: flex-start; }
        .message.user { background: #0284c7; color: white; align-self: flex-end; }
        .input-section { padding: 15px; border-top: 1px solid #334155; background: #1e293b; display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 10px 14px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; outline: none; }
        input[type="text"]:focus { border-color: #38bdf8; }
        button { padding: 10px 18px; background: #0284c7; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
        button:hover { background: #0369a1; }
        .preview-header { padding: 10px 15px; background: #0f172a; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        iframe { flex: 1; border: none; background: white; width: 100%; height: 100%; }
        .templates { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .chip { background: #334155; padding: 4px 10px; border-radius: 12px; font-size: 12px; cursor: pointer; border: 1px solid #475569; }
        .chip:hover { background: #475569; }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ AI WebStudio</div>
        <div style="font-size: 13px; color: #94a3b8;">AI Website Builder</div>
    </header>

    <div class="main-container">
        <!-- Left Panel: AI Chat and Prompts -->
        <div class="left-panel">
            <div class="chat-section" id="chatSection">
                <div class="message ai">
                    Hello! I am your AI web developer assistant. What kind of website would you like to build?
                </div>
                <div class="templates">
                    <div class="chip" onclick="quickPrompt('Create a colorful juice brand website')">🍹 Juice Brand</div>
                    <div class="chip" onclick="quickPrompt('Build a modern restaurant menu and order site')">🍕 Restaurant Menu</div>
                    <div class="chip" onclick="quickPrompt('Make a dark theme portfolio and about me site')">💼 Portfolio Site</div>
                </div>
            </div>
            <div class="input-section">
                <input type="text" id="userInput" placeholder="E.g., Modern online store homepage..." onkeypress="handleKey(event)">
                <button onclick="generateSite()">Generate</button>
            </div>
        </div>

        <!-- Right Panel: Live Preview -->
        <div class="right-panel">
            <div class="preview-header">
                <span>👁️ Live Preview</span>
                <button style="padding: 4px 10px; font-size: 12px;" onclick="downloadCode()">Download Code</button>
            </div>
            <iframe id="previewFrame"></iframe>
        </div>
    </div>

    <script>
        let currentCode = `
            <!DOCTYPE html>
            <html>
            <head>
                <style>
                    body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background: #f4f4f9; color: #333; }
                    h1 { color: #0284c7; }
                </style>
            </head>
            <body>
                <h1>Welcome to AI WebStudio!</h1>
                <p>Describe your website in the left panel or click one of the quick templates to get started.</p>
            </body>
            </html>
        `;

        function updatePreview(code) {
            currentCode = code;
            const frame = document.getElementById('previewFrame');
            frame.srcdoc = code;
        }

        updatePreview(currentCode);

        function handleKey(e) {
            if(e.key === 'Enter') generateSite();
        }

        function quickPrompt(text) {
            document.getElementById('userInput').value = text;
            generateSite();
        }

        function generateSite() {
            const input = document.getElementById('userInput');
            const prompt = input.value.trim();
            if(!prompt) return;

            const chat = document.getElementById('chatSection');
            chat.innerHTML += `<div class="message user">${prompt}</div>`;
            input.value = '';
            
            chat.innerHTML += `<div class="message ai" id="loading">⏳ Generating your website...</div>`;
            chat.scrollTop = chat.scrollHeight;

            setTimeout(() => {
                const loading = document.getElementById('loading');
                if(loading) loading.remove();

                let demoCode = "";
                if(prompt.toLowerCase().includes("juice") || prompt.toLowerCase().includes("şirə")) {
                    demoCode = `<html><head><style>body{font-family:sans-serif;background:#fff7ed;color:#ea580c;text-align:center;padding:40px;}button{background:#ea580c;color:white;border:none;padding:12px 24px;border-radius:20px;font-size:16px;cursor:pointer;}</style></head><body><h1>🍹 Natural Juices</h1><p>100% natural and refreshing fruit juices.</p><button>Order Now</button></body></html>`;
                } else if(prompt.toLowerCase().includes("restaurant") || prompt.toLowerCase().includes("menu")) {
                    demoCode = `<html><head><style>body{font-family:sans-serif;background:#18181b;color:#f4f4f5;padding:30px;}.menu-item{border-bottom:1px solid #3f3f46;padding:10px 0;display:flex;justify-content:space-between;}</style></head><body><h1 style="color:#f59e0b;">🍕 Delicious Restaurant</h1><div class="menu-item"><span>Margherita Pizza</span><span>$12</span></div><div class="menu-item"><span>Burger Combo</span><span>$10</span></div></body></html>`;
                } else {
                    demoCode = `<html><head><style>body{font-family:sans-serif;background:#090d16;color:#e2e8f0;padding:40px;text-align:center;}h1{color:#38bdf8;}.card{background:#1e293b;padding:20px;border-radius:8px;margin-top:20px;}</style></head><body><h1>💼 Personal Portfolio</h1><div class="card"><h2>Web Developer & AI Enthusiast</h2><p>Building modern websites and applications.</p></div></body></html>`;
                }

                updatePreview(demoCode);
                chat.innerHTML += `<div class="message ai">✅ Your website has been generated! Check the live preview on the right panel.</div>`;
                chat.scrollTop = chat.scrollHeight;
            }, 1200);
        }

        function downloadCode() {
            const blob = new Blob([currentCode], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'index.html';
            a.click();
        }
    </script>
</body>
</html>
